<style>

select,button{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
button{font-weight:600;letter-spacing:.2px}button.go{background:var(--ac);color:#111;font-weight:800;border-color:var(--ac)}button.stop{background:var(--dn);color:#fff;border-color:var(--dn)}
.grid{display:grid;gap:12px;padding:12px;max-width:1200px;margin:auto;grid-template-columns:1fr 330px;grid-template-areas:"chart sig" "chart stats" "chart bt" "log log"}

ul{margin:8px 0 0;padding-left:18px;color:var(--mu)}.pos{margin-top:10px;padding:10px;background:var(--pn2);border-radius:10px}

</style></head><body>
<div class="top"><div class="logo">GOLD<b>ROBOT</b> <small>XAU/USD</small></div><div id="px">—</div><small id="chg"></small><span class="pill" id="st">MENGHUBUNGKAN…</span><span class="sp"></span>
<select id="tf"><option value="1min">1m</option><option value="5min">5m</option><option value="15min">15m</option><option value="1h" selected>1H</option><option value="4h">4H</option></select>

<div class="card chart"><div class="cv"><canvas id="cv"></canvas><div id="msg"></div><div class="zb"><button id="zi">+</button><button id="zo">-</button><button id="zr">Reset</button><button id="zz">Zona: ON</button></div></div><div class="cv s"><canvas id="cr"></canvas></div></div>
<div class="card stats"><h3>Akun Paper Trading</h3><div class="kv" id="kv"></div></div>
<div class="card bt"><h3>Backtest &amp; Akun</h3><div class="row"><button id="btn">Backtest</button><button id="rs">Reset akun</button><button id="nt">Aktifkan notifikasi</button></div><div class="row" style="margin-top:10px"><input id="key" placeholder="API key TwelveData (opsional)" style="flex:1;min-width:0;background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px"><button id="sk">Simpan &amp; hubungkan</button></div><div id="btr" style="margin-top:10px"></div><small id="info"></small></div>

</div>
<div id="toast"></div>
<script>
/* ============ 1. PENGATURAN (edit angka di sini) ============ */
const CONFIG={
  API_KEYS:[], // JANGAN isi key di sini jika repo publik. Isi lewat aplikasi (disimpan di HP).
  SYMBOL:'XAU/USD',
  BALANCE:10000,   // modal awal akun virtual ($)
  RISK_PCT:1,      // risiko per trade (% dari balance)
  RR:2,            // take profit = RR x jarak stop loss
  SL_ATR:1.5,      // stop loss = SL_ATR x ATR(14)
  MAX_CREDITS:780, // batas request per hari (gratis = 800)
  MA_TYPE:'sma',   // 'sma' atau 'ema'
  FAST:4,          // periode MA cepat
  SLOW:20          // periode MA lambat
};
CONFIG.LINES=[[CONFIG.MA_TYPE,CONFIG.FAST,'#f5c542'],[CONFIG.MA_TYPE,CONFIG.SLOW,'#4aa3ff']]; // garis di chart
/* ============ 2. STRATEGI (edit logika di sini) ============
 i = nomor candle yang baru tutup. X berisi indikator:
 X.close/open/high/low[i] · X.ema(p)[i] · X.sma(p)[i] · X.rsi(p)[i]
 X.macd().line/signal/hist[i] · X.atr(p)[i] · X.bb(p,k).up/mid/low[i]
 Kembalikan buy('alasan') / sell('alasan') / wait('alasan'). */
function strategy(i,X){
  // Strategi: persilangan MA cepat (FAST) dengan MA lambat (SLOW) di timeframe H1
  const t=CONFIG.MA_TYPE,F=CONFIG.FAST,S=CONFIG.SLOW,f=X[t](F),s=X[t](S),nm=t.toUpperCase();
  const up=j=>f[j-1]<=s[j-1]&&f[j]>s[j], dn=j=>f[j-1]>=s[j-1]&&f[j]<s[j];
  if(up(i)) return buy(`${nm}${F} memotong ke atas ${nm}${S} (golden cross)`);
  if(dn(i)) return sell(`${nm}${F} memotong ke bawah ${nm}${S} (death cross)`);
  let j=i-1;while(j>S&&!up(j)&&!dn(j))j--;
  const last=j>S?(up(j)?'BUY':'SELL')+', '+(i-j)+' candle lalu':'belum ada';
  return wait(`Tidak ada persilangan. ${nm}${F} ${f[i]>s[i]?'di atas':'di bawah'} ${nm}${S}. Persilangan terakhir: ${last}`);
}
const buy=(w,c=2)=>({sig:'BUY',why:w,conf:c}),sell=(w,c=2)=>({sig:'SELL',why:w,conf:c}),wait=w=>({sig:'WAIT',why:w,conf:0});
/* ============ 3. MESIN (tidak perlu diubah) ============ */
const $=q=>document.querySelector(q),f2=v=>v.toFixed(2),SEC={'1min':60,'5min':300,'15min':900,'1h':3600,'4h':14400};
let KEY='',D=[],X,A,botOn=0,live=0,dirty=1,tf='1h',sg=null,pv,lastPoll=0,used=0,mouse=null,lastN=-1,ex;
const dk='td_used_'+new Date().toISOString().slice(0,10);try{used=+localStorage.getItem(dk)||0}catch(e){}
const addUsed=()=>{used++;try{localStorage.setItem(dk,used)}catch(e){}};
const mkA=l=>({live:l,bal:CONFIG.BALANCE,b0:CONFIG.BALANCE,pos:null,trades:[],last:'WAIT'});A=mkA(1);
const EMA=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map((v,i)=>e=i?v*k+e*(1-k):v)};
const SMA=(a,p)=>a.map((_,i)=>{if(i<p-1)return NaN;let s=0;for(let j=i-p+1;j<=i;j++)s+=a[j];return s/p});
function RSI(c,p){const r=c.map(()=>50);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];if(i<=p){g+=Math.max(d,0);l+=Math.max(-d,0);if(i==p){g/=p;l/=p;r[i]=100-100/(1+g/(l||1e-9))}}else{g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p;r[i]=100-100/(1+g/(l||1e-9))}}return r}
function calc(){const c=D.map(d=>d.c),m={},M=(k,f)=>m[k]||(m[k]=f());
zd=1;X={close:c,open:D.map(d=>d.o),high:D.map(d=>d.h),low:D.map(d=>d.l),ema:p=>M('e'+p,()=>EMA(c,p)),sma:p=>M('s'+p,()=>SMA(c,p)),rsi:(p=14)=>M('r'+p,()=>RSI(c,p)),
macd:(a=12,b=26,s=9)=>M('m'+a+b+s,()=>{const ea=EMA(c,a),eb=EMA(c,b),l=ea.map((v,i)=>v-eb[i]),sn=EMA(l,s);return{line:l,signal:sn,hist:l.map((v,i)=>v-sn[i])}}),
atr:(p=14)=>M('a'+p,()=>{let a=0;return D.map((d,i)=>{const t=i?Math.max(d.h-d.l,Math.abs(d.h-D[i-1].c),Math.abs(d.l-D[i-1].c)):d.h-d.l;return a=i<p?(a*i+t)/(i+1):(a*(p-1)+t)/p})}),
bb:(p=20,k=2)=>M('b'+p+k,()=>{const mid=SMA(c,p),sd=c.map((_,i)=>{if(i<p-1)return NaN;let s=0;for(let j=i-p+1;j<=i;j++)s+=(c[j]-mid[i])**2;return Math.sqrt(s/p)});return{mid,up:mid.map((v,i)=>v+k*sd[i]),low:mid.map((v,i)=>v-k*sd[i])}})}}
function run(i){try{ex=null;return strategy(i,X)}catch(e){ex=e.message;return wait('Error strategi: '+e.message)}}
let quiet=0;
function toast(t,b){const e=$('#toast');e.innerHTML='<b>'+t+'</b><br>'+b;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',8000)}
async function notify(t,b){try{toast(t,b)}catch(e){}if(!('Notification' in window)||Notification.permission!='granted')return;try{const r=await navigator.serviceWorker.getRegistration(),o={body:b,icon:'icon-192.png',badge:'icon-192.png',tag:'gold-'+Date.now(),vibrate:[300,120,300,120,300],requireInteraction:true};if(r)r.showNotification(t,o);else new Notification(t,o)}catch(e){}}
const sk=()=>'gold_state_'+tf;
function save(){try{localStorage.setItem(sk(),JSON.stringify({botOn,bal:A.bal,b0:A.b0,last:A.last,lastT:A.lastT,pos:A.pos,trades:A.trades.slice(-200)}))}catch(e){}}
function catchUp(){quiet=1;const n0=A.trades.length;let sigs=0;const from=A.lastT||D[D.length-2].t;for(let i=0;i<D.length-1;i++){if(D[i].t<=from)continue;manage(A,D[i].h,D[i].l,i);const b=A.last;onBar(A,i);if(A.last!=b&&A.last!='WAIT')sigs++;A.lastT=D[i].t}quiet=0;const dn=A.trades.length-n0;if(sigs||dn)notify('Gold Robot aktif lagi',`Selama aplikasi tertutup: ${sigs} sinyal, ${dn} trade selesai`)}
function restore(){let S=null;try{S=JSON.parse(localStorage.getItem(sk())||'null')}catch(e){}if(!S)return;A=Object.assign(mkA(1),{bal:S.bal,b0:S.b0,last:S.last,lastT:S.lastT,pos:S.pos,trades:S.trades||[]});const ix=t=>D.findIndex(d=>d.t==t);if(A.pos)A.pos.i=ix(A.pos.t);A.trades.forEach(t=>{t.i=ix(t.t);t.j=ix(t.tj)});if(S.botOn){botOn=1;catchUp()}}
function openP(A,dir,i){const e=D[i].c,sl=X.atr(14)[i]*CONFIG.SL_ATR,lot=Math.max(.01,Math.floor(A.bal*CONFIG.RISK_PCT/100/(sl*100)*100)/100);A.pos={dir,entry:e,sl:e-dir*sl,tp:e+dir*sl*CONFIG.RR,lot,i,t:D[i].t};if(A.live&&!quiet)notify((dir>0?'BUY':'SELL')+' dibuka XAU/USD',`Entry ${f2(e)} | TP ${f2(A.pos.tp)} | SL ${f2(A.pos.sl)} | ${lot} lot`)}
function closeP(A,px,why,j){const p=A.pos,pnl=(px-p.entry)*p.dir*100*p.lot;A.bal+=pnl;A.trades.push({...p,exit:px,pnl,why,j,tj:D[j].t});A.pos=null;if(A.live&&!quiet)notify((why=='TP'?'Take Profit tersentuh':why=='SL'?'Stop Loss tersentuh':'Posisi ditutup ('+why+')')+' - XAU/USD',`${p.dir>0?'BUY':'SELL'} ${f2(p.entry)} -> ${f2(px)} | ${pnl>=0?'+':'-'}$${f2(Math.abs(pnl))} | Balance $${f2(A.bal)}`)}
function manage(A,h,l,j){const p=A.pos;if(!p)return;if(p.dir>0){if(l<=p.sl)closeP(A,p.sl,'SL',j);else if(h>=p.tp)closeP(A,p.tp,'TP',j)}else{if(h>=p.sl)closeP(A,p.sl,'SL',j);else if(l<=p.tp)closeP(A,p.tp,'TP',j)}}
function onBar(A,i){const g=run(i);if(g.sig!='WAIT'&&g.sig!=A.last){const dir=g.sig=='BUY'?1:-1;if(A.pos&&A.pos.dir!=dir)closeP(A,D[i].c,'Reverse',i);if(!A.pos)openP(A,dir,i)}A.last=g.sig;return g}
function stats(A){const t=A.trades,w=t.filter(x=>x.pnl>0),gw=w.reduce((a,x)=>a+x.pnl,0),gl=-t.filter(x=>x.pnl<=0).reduce((a,x)=>a+x.pnl,0);let e=A.b0,pk=e,dd=0;t.forEach(x=>{e+=x.pnl;pk=Math.max(pk,e);dd=Math.max(dd,(pk-e)/pk*100)});return{n:t.length,wr:t.length?w.length/t.length*100:0,pf:gl?gw/gl:gw?99:0,dd,net:A.bal-A.b0}}
const eq=A=>A.bal+(A.pos?(D[D.length-1].c-A.pos.entry)*A.pos.dir*100*A.pos.lot:0);
function backtest(){const B=mkA();for(let i=40;i<D.length;i++){manage(B,D[i].h,D[i].l,i);onBar(B,i)}if(B.pos)closeP(B,D[D.length-1].c,'End',D.length-1);const s=stats(B);
$('#btr').innerHTML=`<div class="kv"><div><small>Trade</small><b>${s.n}</b></div><div><small>Win rate</small><b>${s.wr.toFixed(0)}%</b></div><div><small>Profit factor</small><b>${s.pf.toFixed(2)}</b></div><div><small>Net P/L</small><b class="${s.net>=0?'up':'dn'}">${s.net>=0?'+':''}$${f2(s.net)}</b></div><div><small>Max drawdown</small><b>${s.dd.toFixed(1)}%</b></div><div><small>Candle diuji</small><b>${D.length}</b></div></div>`}
function showSig(){sg=run(D.length-2);const col=sg.sig=='BUY'?'var(--up)':sg.sig=='SELL'?'var(--dn)':'var(--ac)',cf=sg.sig=='WAIT'?0:100;$('#sg').textContent=sg.sig;$('#sg').style.color=col;$('#cf').style.cssText=`width:${cf}%;background:${col}`;$('#cft').textContent=sg.sig=='WAIT'?'Menunggu persilangan':'Persilangan terdeteksi pada candle terakhir';$('#why').innerHTML=`<li>${sg.why}</li>`+(ex?`<li class="dn">${ex}</li>`:'')}
/* ---- data TwelveData ---- */
const goldOpen=()=>{const d=new Date(),w=d.getUTCDay(),h=d.getUTCHours();return !(w==6||(w==5&&h>=22)||(w==0&&h<22))};
const td=v=>({t:Date.parse(v.datetime.replace(' ','T')+'Z')/1000,o:+v.open,h:+v.high,l:+v.low,c:+v.close});
async function fetchBars(n){addUsed();const j=await(await fetch(`https://api.twelvedata.com/time_series?symbol=${CONFIG.SYMBOL}&interval=${tf}&outputsize=${n}&timezone=UTC&apikey=${KEY}`)).json();if(j.status=='error'||!j.values)throw Error(j.message||'data kosong');return j.values.slice().reverse().map(td)}
function feed(b){const L=D[D.length-1];if(b.t==L.t)Object.assign(L,b);else if(b.t>L.t){const ae=V.s+cw()/V.bw>=D.length-1;D.push(b);if(D.length>1500){D.shift();V.s--;A.trades.forEach(t=>{t.i--;t.j--});if(A.pos)A.pos.i--}if(ae)V.s++;calc();if(botOn){onBar(A,D.length-2);A.lastT=D[D.length-2].t}showSig();if(sg.sig!='WAIT')notify('Sinyal '+sg.sig+' XAU/USD '+tf,sg.why)}else return;if(botOn){const Z2=D[D.length-1];manage(A,Z2.h,Z2.l,D.length-1)}save();dirty=1}
async function poll(){lastPoll=Date.now();try{const g=Math.ceil((Date.now()/1e3-D[D.length-1].t)/SEC[tf])+2;(await fetchBars(Math.min(500,Math.max(3,g)))).forEach(feed)}catch(e){}dirty=1}
function startPoll(){clearInterval(pv);lastPoll=Date.now();pv=setInterval(()=>{if(!live||document.hidden||!goldOpen()||used>=CONFIG.MAX_CREDITS)return;const s=SEC[tf],n=Date.now(),nb=s>=300&&Math.floor(n/1e3/s)!=Math.floor(lastPoll/1e3/s);if(nb||n-lastPoll>=(s>=300?3e5:12e4))poll()},30000)}
function demo(){const sc=SEC[tf],vol=.001*Math.sqrt(sc/900);let p=4150,t=Math.floor(Date.now()/1e3/sc)*sc,sd=7+sc%97;const r=()=>(sd=(sd*16807)%2147483647)/2147483647,g=()=>Math.sqrt(-2*Math.log(r()))*Math.cos(6.283*r());D=[];for(let i=0;i<400;i++){const o=p,c=o*(1+Math.sin(i/(20+sc/600))*vol*.3+g()*vol);D.push({t:t-(399-i)*sc,o,h:Math.max(o,c)*(1+vol/4),l:Math.min(o,c)*(1-vol/4),c});p=c}}
function setMsg(h){const m=$('#msg');m.style.display=h?'flex':'none';m.innerHTML=h?`<div>${h}</div>`:''}
function explain(e){const m=e.message||String(e);if(e instanceof TypeError||/fetch|network|load failed/i.test(m))return 'Browser tidak bisa menjangkau api.twelvedata.com. Biasanya karena file dibuka di dalam aplikasi lain (misalnya Claude) atau internet mati. Simpan file ke HP lalu buka lewat Chrome.';return 'Twelve Data menjawab: '+m}
const tech=e=>`<small>Detail teknis: ${e.name||'Error'} - ${e.message||e} | protokol ${typeof location!='undefined'?location.protocol:'?'} | online ${typeof navigator!='undefined'?navigator.onLine:'?'} | key ${(KEY||'-').slice(0,4)}...</small>`
function startDemo(){live=0;demo();calc();resetView();setMsg(null);const st=$('#st');st.className='pill demo';st.textContent='DEMO (bukan harga pasar)';showSig();dirty=1}
async function connect(){tf=$('#tf').value;live=0;clearInterval(pv);botOn=0;A=mkA(1);lastN=-1;D=[];sg=null;const st=$('#st');st.className='pill';st.textContent='MENGHUBUNGKAN';$('#info').textContent='';
setMsg('<b>Mengambil data XAU/USD '+tf+' dari Twelve Data...</b>');$('#sg').textContent='-';$('#sg').style.color='';$('#why').innerHTML='';$('#cf').style.width='0';$('#cft').textContent='';$('#pos').innerHTML='';dirty=1;
try{let er,ok=0;const ks=[];try{ks.push(localStorage.getItem('td_key'))}catch(e){}ks.push(...CONFIG.API_KEYS);
if(!ks.filter(Boolean).length){st.className='pill err';st.textContent='BUTUH API KEY';setMsg('<b>Masukkan API key Twelve Data</b><p>Cukup sekali. Key disimpan di HP ini saja, tidak ikut ke GitHub.</p><div class="row" style="justify-content:center"><input id="mk" placeholder="API key" style="background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px;min-width:0"><button class="go" id="mb">Simpan &amp; hubungkan</button></div>');$('#mb').onclick=()=>{const v=$('#mk').value.trim();if(v){try{localStorage.setItem('td_key',v)}catch(e){}connect()}};dirty=1;return}
for(const k of ks.filter(Boolean)){KEY=k;try{D=await fetchBars(1000);ok=1;break}catch(e){er=e;if(e instanceof TypeError)break}}
if(!ok)throw er||Error('tidak ada API key');if(D.length<60)throw Error('data terlalu sedikit ('+D.length+' candle)');
live=1;st.className='pill live';st.textContent='LIVE XAU/USD';setMsg(null);calc();restore();resetView();showSig();save();startPoll()}
