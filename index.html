<script>
/* ============ 1. PENGATURAN ============ */
const CONFIG={
  API_KEYS:[],          // jangan isi key di sini jika repo publik; isi lewat aplikasi
  SYMBOL:'XAU/USD',
  BALANCE:10000,        // modal awal akun virtual ($)
  RISK_PCT:1,           // risiko per trade (% balance) -> lot dihitung dari jarak SL
  /* --- 3 Moving Average (video): putih = cepat, hijau = tengah, merah = lambat --- */
  MA_TYPE:'ema',        // 'ema' atau 'sma'
  MA_FAST:20,           // garis putih
  MA_MID:50,            // garis hijau
  MA_SLOW:200,          // garis merah
  OSC_PERIOD:10,        // osilator kuning (momentum = close - close N candle lalu), garis nol = batas
  PULL_ATR:0.5,         // harga dianggap pullback ke MA cepat bila jaraknya <= x ATR
  SL_BUFFER:0.1,        // SL = MA lambat +/- x ATR
  MIN_RISK:0.8,         // jarak SL minimal (USD)
  MAX_RISK:8,           // jarak SL maksimal (USD); lebih jauh = dilewati
  RR:3,                 // TP = RR x jarak SL
  COOLDOWN:6,           // jeda (candle) setelah posisi tertutup
  SPREAD:0.3,           // spread broker (USD), dipotong dari tiap trade
  MAX_CREDITS:780       // batas request/hari (gratis = 800)
};
/* ============ 2. METODE (dari video: 3 moving average + osilator, timeframe M5) ============
 TREN   : tiga MA sejajar. Turun = putih di bawah hijau di bawah merah. Naik = kebalikannya.
          Panah kuning di chart = saat susunan MA berubah menjadi searah (awal tren).
 ENTRI  : searah tren saja. Harga pullback ke MA putih (cepat), candle penolakan (bearish untuk SELL,
          bullish untuk BUY) close kembali di sisi tren dan osilator searah (di bawah nol untuk SELL).
 SL     : tepat di balik MA merah (lambat). TP = RR x jarak SL.
 ATURAN : jika ada posisi terbuka, tidak membuka posisi baru. */
const $=q=>document.querySelector(q),f2=v=>v.toFixed(2),SECB=300;
let KEY='',D=[],AT=[],MF=[],MM=[],MS=[],OSC=[],ORD=[],ARR=[],A,botOn=0,live=0,dirty=1,sg=null,PLAN=null,pv,lastPoll=0,used=0,mouse=null,lastN=-1,quiet=0;
const dk='td_used_'+new Date().toISOString().slice(0,10);try{used=+localStorage.getItem(dk)||0}catch(e){}
const addUsed=()=>{used++;try{localStorage.setItem(dk,used)}catch(e){}};
const mkA=l=>({live:l,bal:CONFIG.BALANCE,b0:CONFIG.BALANCE,pos:null,trades:[],cdT:0});A=mkA(1);
const EMA=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map((v,i)=>e=i?v*k+e*(1-k):v)};
const SMA=(a,p)=>a.map((_,i)=>{if(i<p-1)return NaN;let s=0;for(let j=i-p+1;j<=i;j++)s+=a[j];return s/p});
const ATR=(S,p)=>{let a=0;return S.map((d,i)=>{const t=i?Math.max(d.h-d.l,Math.abs(d.h-S[i-1].c),Math.abs(d.l-S[i-1].c)):d.h-d.l;return a=i<p?(a*i+t)/(i+1):(a*(p-1)+t)/p})};
function calc(){const c=D.map(d=>d.c),ma=CONFIG.MA_TYPE=='sma'?SMA:EMA;MF=ma(c,CONFIG.MA_FAST);MM=ma(c,CONFIG.MA_MID);MS=ma(c,CONFIG.MA_SLOW);AT=ATR(D,14);OSC=c.map((v,i)=>i>=CONFIG.OSC_PERIOD?v-c[i-CONFIG.OSC_PERIOD]:0);
ORD=c.map((_,i)=>MF[i]>MM[i]&&MM[i]>MS[i]?1:MF[i]<MM[i]&&MM[i]<MS[i]?-1:0);ARR=[];for(let i=CONFIG.MA_SLOW;i<c.length;i++)if(ORD[i]&&ORD[i]!=ORD[i-1])ARR.push({i,dir:ORD[i]});dirty=1}
function scan(A,i,make){const R={sig:'WAIT',why:[],stage:0,plan:null};if(i<CONFIG.MA_SLOW+2||isNaN(MS[i])){R.why.push('Data belum cukup untuk MA'+CONFIG.MA_SLOW);return R}
const dir=ORD[i],a=AT[i],d=D[i],F=MF[i],S=MS[i],nm=CONFIG.MA_TYPE.toUpperCase();
if(!dir){R.why.push(`Tiga MA belum sejajar (${nm}${CONFIG.MA_FAST}/${CONFIG.MA_MID}/${CONFIG.MA_SLOW}): market sideways, tidak trading`);return R}
R.stage=1;R.dir=dir;R.why.push(`Tren ${dir>0?'NAIK':'TURUN'}: MA putih ${dir>0?'di atas':'di bawah'} hijau ${dir>0?'di atas':'di bawah'} merah. Hanya ${dir>0?'BUY':'SELL'}`);
const near=dir<0?d.h>=F-CONFIG.PULL_ATR*a:d.l<=F+CONFIG.PULL_ATR*a;
if(!near){R.why.push('Menunggu pullback harga ke MA putih (cepat)');return R}
R.stage=2;const rej=dir<0?d.c<d.o&&d.c<F:d.c>d.o&&d.c>F,osc=dir<0?OSC[i]<0:OSC[i]>0;
if(!rej||!osc){R.why.push('Pullback ke MA putih. Menunggu '+(rej?'':`candle penolakan ${dir<0?'bearish':'bullish'} close ${dir<0?'di bawah':'di atas'} MA putih`)+(rej||osc?'':' dan ')+(osc?'':`osilator ${dir<0?'di bawah':'di atas'} nol`));return R}
const entry=d.c,buf=CONFIG.SL_BUFFER*a,sl=dir<0?Math.max(S+buf,entry+CONFIG.MIN_RISK):Math.min(S-buf,entry-CONFIG.MIN_RISK),risk=Math.abs(sl-entry);
if(risk>CONFIG.MAX_RISK){R.why.push('Setup valid tetapi jarak SL ke MA merah '+f2(risk)+' terlalu jauh (maks '+CONFIG.MAX_RISK+'), dilewati');return R}
if(d.t<A.cdT){R.why.push('Jeda setelah posisi tertutup, menunggu '+CONFIG.COOLDOWN+' candle');return R}
const o={dir,entry,sl,tp:entry+dir*risk*CONFIG.RR,type:(dir>0?'BUY':'SELL')+' MARKET',via:'PULLBACK',t:d.t,i};
R.stage=3;R.sig=dir>0?'BUY':'SELL';R.plan=o;R.why.push(`Candle penolakan di MA putih + osilator ${dir<0?'< 0':'> 0'}`,`Entry ${f2(entry)} | SL ${f2(sl)} (di balik MA merah) | TP ${f2(o.tp)} (RR 1:${CONFIG.RR})`);
if(make){if(A.pos)R.why.push('Posisi masih terbuka: TIDAK membuka posisi baru');else openP(A,o,i)}
return R}
const cycle=(A,i)=>scan(A,i,true);
/* ============ 3. MESIN AKUN (paper trading) ============ */
const nt=(A,t,b)=>{if(A.live&&!quiet)notify(t,b)};
function openP(A,o,i){const lot=Math.max(.01,Math.floor(A.bal*CONFIG.RISK_PCT/100/(Math.abs(o.entry-o.sl)*100)*100)/100);A.pos={dir:o.dir,entry:o.entry,sl:o.sl,tp:o.tp,lot,i,t:D[i].t,via:o.via};
nt(A,(o.dir>0?'BUY':'SELL')+' dibuka (pullback MA) - XAU/USD',`Entry ${f2(o.entry)} | TP ${f2(o.tp)} | SL ${f2(o.sl)} | ${lot} lot`)}
function manage(A,h,l,j){const p=A.pos;if(!p)return;if(p.dir>0){if(l<=p.sl)closeP(A,p.sl,'SL',j);else if(h>=p.tp)closeP(A,p.tp,'TP',j)}else{if(h>=p.sl)closeP(A,p.sl,'SL',j);else if(l<=p.tp)closeP(A,p.tp,'TP',j)}}
function closeP(A,px,why,j){const p=A.pos,pnl=(px-p.entry)*p.dir*100*p.lot-CONFIG.SPREAD*100*p.lot;A.bal+=pnl;A.trades.push({...p,exit:px,pnl,why,j,tj:D[j].t});A.pos=null;A.cdT=D[j].t+CONFIG.COOLDOWN*SECB;
nt(A,(why=='TP'?'Take Profit tersentuh':why=='SL'?'Stop Loss tersentuh':'Posisi ditutup ('+why+')')+' - XAU/USD',`${p.dir>0?'BUY':'SELL'} ${f2(p.entry)} -> ${f2(px)} | ${pnl>=0?'+':'-'}$${f2(Math.abs(pnl))} | Balance $${f2(A.bal)}`)}
function stats(A){const t=A.trades,w=t.filter(x=>x.pnl>0),gw=w.reduce((a,x)=>a+x.pnl,0),gl=-t.filter(x=>x.pnl<=0).reduce((a,x)=>a+x.pnl,0);let e=A.b0,pk=e,dd=0;t.forEach(x=>{e+=x.pnl;pk=Math.max(pk,e);dd=Math.max(dd,(pk-e)/pk*100)});return{n:t.length,wr:t.length?w.length/t.length*100:0,pf:gl?gw/gl:gw?99:0,dd,net:A.bal-A.b0}}
const eq=A=>A.bal+(A.pos?(D[D.length-1].c-A.pos.entry)*A.pos.dir*100*A.pos.lot:0);
function backtest(){const B=mkA();for(let i=CONFIG.MA_SLOW+2;i<D.length;i++){manage(B,D[i].h,D[i].l,i);cycle(B,i)}if(B.pos)closeP(B,D[D.length-1].c,'End',D.length-1);const s=stats(B);
$('#btr').innerHTML=`<div class="kv"><div><small>Trade</small><b>${s.n}</b></div><div><small>Win rate</small><b>${s.wr.toFixed(0)}%</b></div><div><small>Profit factor</small><b>${s.pf.toFixed(2)}</b></div><div><small>Net P/L</small><b class="${s.net>=0?'up':'dn'}">${s.net>=0?'+':''}$${f2(s.net)}</b></div><div><small>Max drawdown</small><b>${s.dd.toFixed(1)}%</b></div><div><small>Candle M5 diuji</small><b>${D.length-CONFIG.MA_SLOW}</b></div></div>`}
/* ---- notifikasi, penyimpanan, resume ---- */
function toast(t,b){const e=$('#toast');e.innerHTML='<b>'+t+'</b><br>'+b;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',8000)}
async function notify(t,b){try{toast(t,b)}catch(e){}if(!('Notification' in window)||Notification.permission!='granted')return;try{const r=await navigator.serviceWorker.getRegistration(),o={body:b,icon:'icon-192.png',badge:'icon-192.png',tag:'gold-'+Date.now(),vibrate:[300,120,300,120,300],requireInteraction:true};if(r)r.showNotification(t,o);else new Notification(t,o)}catch(e){}}
const sk=()=>'gold_3ma_v1';
function save(){try{localStorage.setItem(sk(),JSON.stringify({botOn,bal:A.bal,b0:A.b0,lastT:A.lastT,cdT:A.cdT,pos:A.pos,trades:A.trades.slice(-200)}))}catch(e){}}
function catchUp(){quiet=1;const n0=A.trades.length,from=A.lastT||D[D.length-2].t;let o0=0;for(let i=0;i<D.length-1;i++){if(D[i].t<=from)continue;manage(A,D[i].h,D[i].l,i);const had=!!A.pos;cycle(A,i);if(!had&&A.pos)o0++;A.lastT=D[i].t}quiet=0;const dn=A.trades.length-n0;if(dn||o0)notify('Gold Robot aktif lagi',`Selama aplikasi tertutup: ${o0} entri, ${dn} trade selesai`)}
function restore(){let S=null;try{S=JSON.parse(localStorage.getItem(sk())||'null')}catch(e){}if(!S)return;A=Object.assign(mkA(1),{bal:S.bal,b0:S.b0,lastT:S.lastT,cdT:S.cdT||0,pos:S.pos,trades:S.trades||[]});const ix=t=>D.findIndex(d=>d.t==t);if(A.pos)A.pos.i=ix(A.pos.t);A.trades.forEach(t=>{t.i=ix(t.t);t.j=ix(t.tj)});if(S.botOn){botOn=1;catchUp()}}
/* ---- data TwelveData (M5) ---- */
const goldOpen=()=>{const d=new Date(),w=d.getUTCDay(),h=d.getUTCHours();return !(w==6||(w==5&&h>=22)||(w==0&&h<22))};
const td=v=>({t:Date.parse(v.datetime.replace(' ','T')+'Z')/1000,o:+v.open,h:+v.high,l:+v.low,c:+v.close});
async function fetchBars(n){addUsed();const j=await(await fetch(`https://api.twelvedata.com/time_series?symbol=${CONFIG.SYMBOL}&interval=5min&outputsize=${n}&timezone=UTC&apikey=${KEY}`)).json();if(j.status=='error'||!j.values)throw Error(j.message||'data kosong');return j.values.slice().reverse().map(td)}
function feed(b){const L=D[D.length-1];if(b.t==L.t)Object.assign(L,b);else if(b.t>L.t){const ae=V.s+cw()/V.bw>=D.length-1;D.push(b);if(D.length>1500){D.shift();V.s--;A.trades.forEach(t=>{t.i--;t.j--});if(A.pos)A.pos.i--}if(ae)V.s++;calc();if(botOn){const i=D.length-2;cycle(A,i);A.lastT=D[i].t}showSig()}else return;if(botOn){const Z2=D[D.length-1];manage(A,Z2.h,Z2.l,D.length-1)}save();dirty=1}
async function poll(){lastPoll=Date.now();try{const g=Math.ceil((Date.now()/1e3-D[D.length-1].t)/SECB)+2;(await fetchBars(Math.min(500,Math.max(3,g)))).forEach(feed)}catch(e){}dirty=1}
function startPoll(){clearInterval(pv);lastPoll=Date.now();pv=setInterval(()=>{if(!live||document.hidden||!goldOpen()||used>=CONFIG.MAX_CREDITS)return;const n=Date.now();if(Math.floor(n/1e3/SECB)!=Math.floor(lastPoll/1e3/SECB)||n-lastPoll>=3e5)poll()},30000)}
function demo(){let sd=7,p=1775;const t0=Math.floor(Date.now()/1e3/SECB)*SECB,r=()=>(sd=(sd*16807)%2147483647)/2147483647,g=()=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.283*r());D=[];
for(let j=0;j<1000;j++){const o=p,c=o*(1+Math.sin(j/60)*.00022+Math.sin(j/17)*.00012+g()*.00028);D.push({t:t0-(999-j)*SECB,o,h:Math.max(o,c)*(1+Math.abs(g())*.0001),l:Math.min(o,c)*(1-Math.abs(g())*.0001),c});p=c}}
function startDemo(){live=0;demo();calc();resetView();setMsg(null);const st=$('#st');st.className='pill demo';st.textContent='DEMO (bukan harga pasar)';showSig();dirty=1}
function setMsg(h){const m=$('#msg');m.style.display=h?'flex':'none';m.innerHTML=h?`<div>${h}</div>`:''}
function explain(e){const m=e.message||String(e);if(e instanceof TypeError||/fetch|network|load failed/i.test(m))return 'Browser tidak bisa menjangkau api.twelvedata.com. Biasanya karena file dibuka di dalam aplikasi lain atau internet mati. Buka lewat Chrome.';return 'Twelve Data menjawab: '+m}
const tech=e=>`<small>Detail teknis: ${e.name||'Error'} - ${e.message||e} | protokol ${typeof location!='undefined'?location.protocol:'?'} | online ${typeof navigator!='undefined'?navigator.onLine:'?'} | key ${(KEY||'-').slice(0,4)}...</small>`;
async function connect(){live=0;clearInterval(pv);botOn=0;A=mkA(1);lastN=-1;D=[];sg=null;PLAN=null;const st=$('#st');st.className='pill';st.textContent='MENGHUBUNGKAN';$('#info').textContent='';
setMsg('<b>Mengambil data XAU/USD M5 dari Twelve Data...</b>');$('#sg').textContent='-';$('#sg').style.color='';$('#why').innerHTML='';$('#cf').style.width='0';$('#cft').textContent='';$('#pos').innerHTML='';dirty=1;
try{let er,ok=0;const ks=[];try{ks.push(localStorage.getItem('td_key'))}catch(e){}ks.push(...CONFIG.API_KEYS);
if(!ks.filter(Boolean).length){st.className='pill err';st.textContent='BUTUH API KEY';setMsg('<b>Masukkan API key Twelve Data</b><p>Cukup sekali. Key disimpan di HP ini saja, tidak ikut ke GitHub.</p><div class="row" style="justify-content:center"><input id="mk" placeholder="API key" style="background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px;min-width:0"><button class="go" id="mb">Simpan &amp; hubungkan</button></div>');$('#mb').onclick=()=>{const v=$('#mk').value.trim();if(v){try{localStorage.setItem('td_key',v)}catch(e){}connect()}};dirty=1;return}
for(const k of ks.filter(Boolean)){KEY=k;try{D=await fetchBars(1000);ok=1;break}catch(e){er=e;if(e instanceof TypeError)break}}
if(!ok)throw er||Error('tidak ada API key');if(D.length<CONFIG.MA_SLOW+20)throw Error('data terlalu sedikit ('+D.length+' candle)');
live=1;st.className='pill live';st.textContent='LIVE XAU/USD';setMsg(null);calc();restore();resetView();showSig();save();startPoll()}
