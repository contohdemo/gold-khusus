<div class="top"><div class="logo">GOLD<b>ROBOT</b> <small>XAU/USD</small></div><div id="px">—</div><small id="chg"></small><span class="pill" id="st">MENGHUBUNGKAN…</span><span class="pill">M1 · Ranging Breakout</span><span class="sp"></span>

<script>
/* ============ 1. PENGATURAN ============ */
const CONFIG={
SYMBOL:'XAU/USD',
BALANCE:10000,
RISK_PCT:1,
PIP:0.1,
SL_PIPS:50,
TP_PIPS:100, // RR 1:2
SPREAD:0.3,
RANGE_BARS:[30,20,12], // panjang area ranging (candle M1)
RANGE_MAX_ATR:4,
RANGE_MIN_ATR:0.8,
MAX_CREDITS:780
};
/* ============ 2. METODE (video: scalping M1 breakout area ranging)
1. Cari area ranging / konsolidasi (base) di M1.
2. Candle breakout: CLOSE di atas resistance (BUY) atau di bawah support (SELL).
3. Konfirmasi: candle BERIKUTNYA juga close di luar area -> entry MARKET.
4. SL 50 pips, TP 100 pips (RR 1:2).
5. Satu posisi saja. Satu breakout satu entri. */
const $=q=>document.querySelector(q),f2=v=>v.toFixed(2);
let KEY='',D=[],AT=[],A,botOn=0,live=0,dirty=1,sg=null,PLAN=null,RNG=null,pv,lastPoll=0,used=0,mouse=null,lastN=-1,quiet=0,isDemo=0;
const dk='td_used_'+new Date().toISOString().slice(0,10);try{used=+localStorage.getItem(dk)||0}catch(e){}
const addUsed=()=>{used++;try{localStorage.setItem(dk,used)}catch(e){}};
const mkA=l=>({live:l,bal:CONFIG.BALANCE,b0:CONFIG.BALANCE,pos:null,trades:[],used:[]});A=mkA(1);
const ATR=(S,p)=>{let a=0;return S.map((d,i)=>{const t=i?Math.max(d.h-d.l,Math.abs(d.h-S[i-1].c),Math.abs(d.l-S[i-1].c)):d.h-d.l;return a=i<p?(a*i+t)/(i+1):(a*(p-1)+t)/p})};
const calc=()=>{AT=ATR(D,14);dirty=1};
const tIdx=t=>{let a=0,b=D.length-1;if(!D.length||t<=D[0].t)return 0;if(t>D[b].t)return b+1;while(a<b){const m=(a+b)>>1;if(D[m].t<t)a=m+1;else b=m}return a};
function scan(A,i,make){const R={sig:'WAIT',why:[],stage:0,range:null,plan:null};if(i<40||i>=D.length){R.why.push('Data belum cukup');return R}
const sl=CONFIG.SL_PIPS*CONFIG.PIP,tp=CONFIG.TP_PIPS*CONFIG.PIP;
const rng=(e,L)=>{const s=e-L+1,a=AT[e];if(s<1)return null;let hi=-1e9,lo=1e9;for(let k=s;k<=e;k++){hi=Math.max(hi,D[k].h);lo=Math.min(lo,D[k].l)}const hh=hi-lo;if(hh>CONFIG.RANGE_MAX_ATR*a||hh<CONFIG.RANGE_MIN_ATR*a)return null;return{top:hi,bot:lo,t0:D[s].t}};
const mkO=(dir,r,prev)=>{const entry=D[i].c;return{dir,entry,sl:entry-dir*sl,tp:entry+dir*tp,type:(dir>0?'BUY':'SELL')+' MARKET',prev,t:D[i].t,range:r,key:dir+':'+Math.round(r.top*10)+':'+r.t0}};
const side=dir=>dir>0?'di atas resistance':'di bawah support';
/* tahap 3: breakout + konfirmasi */
for(const L of CONFIG.RANGE_BARS){const r=rng(i-2,L);if(!r)continue;const b=D[i-1].c,c=D[i].c,dir=b>r.top&&c>r.top?1:b<r.bot&&c<r.bot?-1:0;if(!dir)continue;
R.range=r;R.stage=3;R.sig=dir>0?'BUY':'SELL';const o=mkO(dir,r,0);
R.why.push(Ranging M1: resistance ${f2(r.top)} / support ${f2(r.bot)},Breakout dan konfirmasi close ${side(dir)} (${f2(dir>0?r.top:r.bot)}),Entry market ${f2(o.entry)} | SL ${f2(o.sl)} (${CONFIG.SL_PIPS} pips) | TP ${f2(o.tp)} (${CONFIG.TP_PIPS} pips));
if(A.used.includes(o.key)){R.stage=4;R.why.push('Breakout ini sudah dipakai untuk entri')}
else{R.plan=o;if(make){if(A.pos)R.why.push('Posisi masih terbuka: TIDAK membuka posisi baru');else openP(A,o,i)}}
return R}
/* tahap 2: breakout, menunggu konfirmasi */
for(const L of CONFIG.RANGE_BARS){const r=rng(i-1,L);if(!r)continue;const c=D[i].c,dir=c>r.top?1:c<r.bot?-1:0;if(!dir)continue;
R.range=r;R.stage=2;R.sig=dir>0?'BUY':'SELL';R.plan=mkO(dir,r,1);
R.why.push(Ranging M1: resistance ${f2(r.top)} / support ${f2(r.bot)},Breakout close ${side(dir)}. Menunggu candle konfirmasi);return R}
/* tahap 1: ranging terdeteksi */
for(const L of CONFIG.RANGE_BARS){const r=rng(i,L);if(!r)continue;
R.range=r;R.stage=1;R.why.push(Ranging M1 terdeteksi: resistance ${f2(r.top)} / support ${f2(r.bot)},'Menunggu candle breakout close di luar area');return R}
R.why.push('Belum ada area ranging / konsolidasi di M1');return R}
const cycle=(A,i)=>scan(A,i,true);
/* ============ 3. MESIN AKUN ============ */
const nt=(t,b)=>{if(A.live&&!quiet)notify(t,b)};
function openP(A,o,i){const lot=Math.max(.01,Math.floor(A.bal*CONFIG.RISK_PCT/100/(Math.abs(o.entry-o.sl)*100)*100)/100);
A.pos={dir:o.dir,entry:o.entry,sl:o.sl,tp:o.tp,lot,i,t:D[i].t,via:o.type,range:o.range};
A.used.push(o.key);if(A.used.length>300)A.used.shift();
nt((o.dir>0?'BUY':'SELL')+' dibuka (breakout ranging) - XAU/USD',Entry ${f2(o.entry)} | TP ${f2(o.tp)} | SL ${f2(o.sl)} | ${lot} lot)}
function manage(A,h,l,j){const p=A.pos;if(!p)return;
if(p.dir>0){if(l<=p.sl)closeP(A,p.sl,'SL',j);else if(h>=p.tp)closeP(A,p.tp,'TP',j)}
else{if(h>=p.sl)closeP(A,p.sl,'SL',j);else if(l<=p.tp)closeP(A,p.tp,'TP',j)}}
function closeP(A,px,why,j){const p=A.pos,pnl=(px-p.entry)*p.dir*100*p.lot-CONFIG.SPREAD*100*p.lot;
A.bal+=pnl;A.trades.push({...p,exit:px,pnl,why,j,tj:D[j].t});A.pos=null;
nt((why=='TP'?'Take Profit tersentuh':why=='SL'?'Stop Loss tersentuh':'Posisi ditutup ('+why+')')+' - XAU/USD',${p.dir>0?'BUY':'SELL'} ${f2(p.entry)} -> ${f2(px)} | ${pnl>=0?'+':'-'}$${f2(Math.abs(pnl))} | Balance $${f2(A.bal)})}
function stats(A){const t=A.trades,w=t.filter(x=>x.pnl>0),gw=w.reduce((a,x)=>a+x.pnl,0),gl=-t.filter(x=>x.pnl<=0).reduce((a,x)=>a+x.pnl,0);
let e=A.b0,pk=e,dd=0;t.forEach(x=>{e+=x.pnl;pk=Math.max(pk,e);dd=Math.max(dd,(pk-e)/pk*100)});
return{n:t.length,wr:t.length?w.length/t.length*100:0,pf:gl?gw/gl:gw?99:0,dd,net:A.bal-A.b0}}
const eq=a=>a.bal+(a.pos?(D[D.length-1].c-a.pos.entry)*a.pos.dir*100*a.pos.lot:0);
function backtest(){const B=mkA(0);for(let i=40;i<D.length;i++){manage(B,D[i].h,D[i].l,i);cycle(B,i)}
if(B.pos)closeP(B,B.pos.entry,'End',D.length-1);const s=stats(B);
$('#btr').innerHTML=<div class="kv"><div><small>Trade</small><b>${s.n}</b></div><div><small>Win rate</small><b>${s.wr.toFixed(0)}%</b></div><div><small>Profit factor</small><b>${s.pf.toFixed(2)}</b></div><div><small>Net P/L</small><b class="${s.net>=0?'up':'dn'}">${s.net>=0?'+':''}$${f2(s.net)}</b></div><div><small>Max drawdown</small><b>${s.dd.toFixed(1)}%</b></div><div><small>Candle M1 diuji</small><b>${D.length}</b></div></div>}
/* ---- notifikasi & penyimpanan ---- */
function toast(t,b){const e=$('#toast');e.innerHTML='<b>'+t+'</b><br>'+b;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',8000)}
async function notify(t,b){try{toast(t,b)}catch(e){}if(!('Notification' in window)||Notification.permission!='granted')return;
try{const r=await navigator.serviceWorker.getRegistration(),o={body:b,icon:'icon-192.png',badge:'icon-192.png',tag:'gold-'+Date.now(),vibrate:[300,120,300,120,300],requireInteraction:true};
if(r)r.showNotification(t,o);else new Notification(t,o)}catch(e){}}
const SK_LIVE='gold_range_live_v1',SK_DEMO='gold_range_demo_v1';
function save(){if(isDemo)return;try{localStorage.setItem(SK_LIVE,JSON.stringify({botOn,bal:A.bal,b0:A.b0,lastT:A.lastT,pos:A.pos,used:A.used,trades:A.trades.slice(-200)}))}catch(e){}}
function catchUp(){quiet=1;const n0=A.trades.length,u0=A.used.length,from=A.lastT||D[D.length-2].t;
for(let i=0;i<D.length-1;i++){if(D[i].t<=from)continue;manage(A,D[i].h,D[i].l,i);cycle(A,i);A.lastT=D[i].t}
quiet=0;const dn=A.trades.length-n0,no=A.used.length-u0;
if(dn||no)notify('Gold Robot aktif lagi',Selama aplikasi tertutup: ${no} entri, ${dn} trade selesai)}
function restore(){let S=null;try{S=JSON.parse(localStorage.getItem(SK_LIVE)||'null')}catch(e){}
if(!S)return;A=Object.assign(mkA(1),{bal:S.bal,b0:S.b0,lastT:S.lastT,pos:S.pos,used:S.used||[],trades:S.trades||[]});
const ix=t=>D.findIndex(d=>d.t==t);if(A.pos)A.pos.i=ix(A.pos.t);
A.trades.forEach(t=>{t.i=ix(t.t);t.j=ix(t.tj)});if(S.botOn){botOn=1;catchUp()}}
/* ---- data TwelveData (M1) ---- */
const goldOpen=()=>{const d=new Date(),w=d.getUTCDay(),h=d.getUTCHours();return !(w==6||(w==5&&h>=22)||(w==0&&h<22))};
const td=v=>({t:Date.parse(v.datetime.replace(' ','T')+'Z')/1000,o:+v.open,h:+v.high,l:+v.low,c:+v.close});
async function fetchBars(n){addUsed();const j=await(await fetch(https://api.twelvedata.com/time_series?symbol=${CONFIG.SYMBOL}&interval=1min&outputsize=${n}&timezone=UTC&apikey=${KEY})).json();
if(j.status=='error'||!j.values)throw Error(j.message||'data kosong');return j.values.slice().reverse().map(td)}
function feed(b){const L=D[D.length-1];if(b.t==L.t)Object.assign(L,b);
else if(b.t>L.t){const ae=V.s+cw()/V.bw>=D.length-1;D.push(b);
if(D.length>1500){D.shift();V.s--;A.trades.forEach(t=>{if(t.i>0)t.i--;if(t.j>0)t.j--});if(A.pos&&A.pos.i>0)A.pos.i--}
if(ae)V.s++;calc();
if(botOn){const i=D.length-2;cycle(A,i);A.lastT=D[i].t}showSig()}
else return;
if(botOn){const Z=D[D.length-1];manage(A,Z.h,Z.l,D.length-1)}save();dirty=1}
async function poll(){lastPoll=Date.now();try{const g=Math.ceil((Date.now()/1e3-D[D.length-1].t)/60)+2;(await fetchBars(Math.min(500,Math.max(3,g)))).forEach(feed)}catch(e){}dirty=1}
function startPoll(){clearInterval(pv);lastPoll=Date.now();pv=setInterval(()=>{if(!live||document.hidden||!goldOpen()||used>=CONFIG.MAX_CREDITS)return;if(Date.now()-lastPoll>=12e4)poll()},30000)}
function demo(){let sd=11,p=4950,mode=0,cnt=0,dr=1;const t0=Math.floor(Date.now()/1e3/60)*60,r=()=>(sd=(sd*16807)%2147483647)/2147483647,g=()=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.283*r());D=[];
for(let j=0;j<1000;j++){if(cnt--<=0){mode=mode?0:1;cnt=mode?20+Math.floor(r()*14):5+Math.floor(r()*8);dr=r()>.5?1:-1}
const o=p;let mv=mode?g()*.00013:dr*.00045+g()*.0002;if(mode)mv+=Math.sin(j/3)*.00008;
const c=o*(1+mv);D.push({t:t0-(999-j)*60,o,h:Math.max(o,c)*(1+Math.abs(g())*.00005),l:Math.min(o,c)*(1-Math.abs(g())*.00005),c});p=c}}
function startDemo(){isDemo=1;live=0;A=mkA(0);botOn=0;demo();calc();resetView();setMsg(null);
const st=$('#st');st.className='pill demo';st.textContent='DEMO (bukan harga pasar)';showSig();dirty=1}
function setMsg(h){const m=$('#msg');m.style.display=h?'flex':'none';m.innerHTML=h?<div>${h}</div>:''}
function explain(e){const m=e.message||String(e);if(e instanceof TypeError||/fetch|network|load failed/i.test(m))return 'Browser tidak bisa menjangkau api.twelvedata.com. Biasanya karena file dibuka di dalam aplikasi lain atau internet mati. Buka lebih lewat Chrome.';return 'Twelve Data menjawab: '+m}
const tech=e=><small>Detail teknis: ${e.name||'Error'} - ${e.message||e} | protokol ${typeof location!='undefined'?location.protocol:'?'} | online ${typeof navigator!='undefined'?navigator.onLine:'?'} | key ${(KEY||'-').slice(0,4)}...</small>;
async function connect(){isDemo=0;live=0;clearInterval(pv);botOn=0;A=mkA(1);lastN=-1;D=[];sg=null;PLAN=null;RNG=null;
const st=$('#st');st.className='pill';st.textContent='MENGHUBUNGKAN';$('#info').textContent='';
setMsg('<b>Mengambil data XAU/USD M1 dari Twelve Data...</b>');$('#sg').textContent='-';$('#sg').style.color='';$('#why').innerHTML='';$('#cf').style.width='0';$('#cft').textContent='';$('#pos').innerHTML='';dirty=1;
try{let er,ok=0;let k0=null;try{k0=localStorage.getItem('td_key')}catch(e){}
if(!k0){st.className='pill err';st.textContent='BUTUH API KEY';
setMsg('<b>Masukkan API key Twelve Data</b><p>Cukup sekali. Key disimpan di HP ini saja, tidak ikut ke GitHub.</p><div class="row" style="justify-content:center"><input id="mk" placeholder="API key"><button class="go" id="mb">Simpan &amp; hubungkan</button></div>');
$('#mb').onclick=()=>{const v=$('#mk').value.trim();if(v){try{localStorage.setItem('td_key',v)}catch(e){}connect()}};dirty=1;return}
KEY=k0;try{D=await fetchBars(1000);ok=1}catch(e){er=e}
if(!ok)throw er||Error('tidak ada API key');
if(D.length<60)throw Error('data terlalu sedikit ('+D.length+' candle)');
live=1;st.className='pill live';st.textContent='LIVE XAU/USD';setMsg(null);calc();restore();resetView();showSig();save();startPoll()}
catch(e){D=[];st.className='pill err';st.textContent='BELUM TERHUBUNG';
setMsg('<b>Gagal terhubung</b><p>'+explain(e)+'</p><p>'+tech(e)+'</p><div class="row"><button class="go" id="m1">Coba lagi</button><button id="m2">Lihat data demo</button></div>');
$('#m1').onclick=connect;$('#m2').onclick=startDemo}
dirty=1}
/* ============ 4. TAMPILAN ============ */
function showSig(){if(D.length<45)return;const R=scan(A,D.length-2,false);
PLAN=A.pos?null:R.plan;RNG=A.pos?A.pos.range:R.range;
let sig=R.sig,pct=[0,30,65,100,100][R.stage],txt=['Belum ada ranging','Ranging terdeteksi, menunggu breakout','Breakout, menunggu candle konfirmasi','Setup terkonfirmasi','Breakout sudah dipakai'][R.stage];
if(R.stage<=1)sig='WAIT';
if(A.pos){sig=A.pos.dir>0?'BUY':'SELL';txt='Posisi terbuka';pct=100;R.why.push('Aturan: ada posisi terbuka, robot TIDAK membuka posisi baru')}
const col=sig=='BUY'?'var(--up)':sig=='SELL'?'var(--dn)':'var(--ac)';
