<script>
/* ============ 1. PENGATURAN ============ */
const CONFIG={
  API_KEYS:[],          // jangan isi key di sini jika repo publik; isi lewat aplikasi
  SYMBOL:'XAU/USD',
  BALANCE:10000,        // modal awal akun virtual ($)
  RISK_PCT:1,           // risiko per trade (% balance)
  RR:3,                 // take profit = RR x jarak SL (video: RR 1:3)
  SPREAD:0.29,          // spread XAU/USD akun Standard (video), dipotong dari tiap trade
  ZONE_ENTRIES:2,       // rules video: 1 zona High TF maksimal 2x entri
  MAX_PENDING:1,        // hanya 1 order pending; tidak ada order baru saat posisi terbuka
  PEND_BARS:45,         // pending kedaluwarsa (candle M1)
  MIN_H:120,            // minimal candle M15 sebelum bot mulai (pemanasan EMA200)
  EMA_FAST:50,EMA_SLOW:200,
  MAX_CREDITS:780
};
CONFIG.LINES=[['ema',50,'#f5c542'],['ema',200,'#ffffff']]; // EMA 50 kuning, EMA 200 putih (seperti video)
/* ============ 2. STRATEGI (dari video) ============
 HTF = M15: tren EMA50 vs EMA200 + zona Supply/Demand Order Block.
 Downtrend -> hanya Supply OB & SELL. Uptrend -> hanya Demand OB & BUY.
 LTF = M1: harga masuk zona M15 -> tunggu CHoCH (close menembus minor structure)
 -> pasang SELL/BUY LIMIT di OB kecil (OB Low TF), SL di luar OB/puncak, TP RR 1:3.
 Rules: 1 zona M15 maksimal 2x entri. Ada posisi/pending aktif = tidak buka posisi baru. */
function strategy(i,X,A){
  const hi=HI[i];
  if(!(hi>=CONFIG.MIN_H))return {sig:'WAIT',why:`Menunggu data M15 cukup (${Math.max(hi,0)}/${CONFIG.MIN_H} candle)`,stage:0,dir:0};
  const dir=HX.e50[hi]<HX.e200[hi]?-1:1,
   tr=dir<0?'M15 Downtrend (EMA50 di bawah EMA200): fokus Supply OB, hanya SELL':'M15 Uptrend (EMA50 di atas EMA200): fokus Demand OB, hanya BUY',
   R=(sig,why,stage,order)=>({sig,why,stage,order,tr,dir}),
   at=X.atr(14)[i],px=D[i].c,all=zonesH(hi).filter(z=>z.type==(dir<0?'S':'D')),
   free=all.filter(z=>(A.uses[z.k]||0)<CONFIG.ZONE_ENTRIES),nm=dir<0?'Supply':'Demand';
  if(!all.length)return R('WAIT','Belum ada zone '+nm+' M15 yang valid',0);
  if(!free.length)return R('WAIT',`Semua zona ${nm} M15 sudah dipakai ${CONFIG.ZONE_ENTRIES}x entri`,0);
  let best=null;
  for(const z of free){
    let pk=-1;
    for(let k=Math.max(5,i-45);k<=i;k++){if(D[k].t<z.ct)continue;if(dir<0?D[k].h>=z.bot:D[k].l<=z.top){if(pk<0||(dir<0?D[k].h>D[pk].h:D[k].l<D[pk].l))pk=k}}
    if(pk<0||i-pk>40)continue;
    let dead=0;for(let k=pk;k<=i;k++)if(dir<0?D[k].c>z.top:D[k].c<z.bot){dead=1;break}
    if(dead)continue;
    let lvl=null,lk=0;
    for(let k=pk-3;k>=Math.max(2,pk-40);k--){const d=D[k],f=dir<0?(d.l<D[k-1].l&&d.l<D[k-2].l&&d.l<D[k+1].l&&d.l<D[k+2].l):(d.h>D[k-1].h&&d.h>D[k-2].h&&d.h>D[k+1].h&&d.h>D[k+2].h);if(f){lvl=dir<0?d.l:d.h;lk=k;break}}
    const zt=`${nm} M15 ${f2(z.bot)}-${f2(z.top)}`;
    if(lvl==null){best=R('WAIT','Harga di zona '+zt+', minor structure belum terbentuk',2);continue}
    const brk=k=>dir<0?D[k].c<lvl:D[k].c>lvl;
    let stale=0;for(let m=pk+1;m<i;m++)if(brk(m)){stale=1;break}
    if(!brk(i)||stale){if(!stale)best=R('WAIT',`Harga di zona ${zt}. Menunggu CHoCH M1: close ${dir<0?'di bawah':'di atas'} ${f2(lvl)}`,2);continue}
    let b=pk;for(let q=pk;q>=pk-3;q--)if(dir<0?D[q].c>D[q].o:D[q].c<D[q].o){b=q;break}
    const top=dir<0?D[b].h:Math.max(D[b].o,D[b].c),bot=dir<0?Math.min(D[b].o,D[b].c):D[b].l,entry=dir<0?bot:top,
     sl=dir<0?Math.max(D[pk].h,D[b].h)+.15*at:Math.min(D[pk].l,D[b].l)-.15*at,risk=Math.abs(sl-entry);
    if(!(risk>.25*at&&risk<8*at)||(dir<0?entry<=px:entry>=px))continue;
    const type=dir<0?'SELL LIMIT':'BUY LIMIT',now=D[i].t;
    return R(dir<0?'SELL':'BUY',`CHoCH M1 di zona ${zt}. ${type} di OB M1 ${f2(entry)}, SL ${f2(sl)}, TP RR 1:${CONFIG.RR}`,3,
     {type,dir,entry,sl,tp:entry-dir*-1*risk*CONFIG.RR*-1,src:nm+' OB M15 + CHoCH M1',t:now,exp:now+CONFIG.PEND_BARS*60,zk:z.k,key:type+':'+Math.round(entry),ob:{t:D[b].t,top,bot},lvl,lt:D[lk].t})}
  return best||R('WAIT',`Menunggu harga masuk zona ${nm} M15 (${f2(free[0].bot)}-${f2(free[0].top)})`,1)}
/* ============ 3. MESIN ============ */
const $=q=>document.querySelector(q),f2=v=>v.toFixed(2),SEC={'1min':60},tf='1min',SECH=900;
let KEY='',D=[],H=[],HI=[],HX={},ZC={},X,A,botOn=0,live=0,dirty=1,sg=null,pv,lastPoll=0,used=0,mouse=null,lastN=-1,ex,Z=[];
const dk='td_used_'+new Date().toISOString().slice(0,10);try{used=+localStorage.getItem(dk)||0}catch(e){}
const addUsed=()=>{used++;try{localStorage.setItem(dk,used)}catch(e){}};
const mkA=l=>({live:l,bal:CONFIG.BALANCE,b0:CONFIG.BALANCE,pos:null,trades:[],pend:[],uses:{},last:'WAIT'});A=mkA(1);
const EMA=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map((v,i)=>e=i?v*k+e*(1-k):v)};
const ATR=(S,p)=>{let a=0;return S.map((d,i)=>{const t=i?Math.max(d.h-d.l,Math.abs(d.h-S[i-1].c),Math.abs(d.l-S[i-1].c)):d.h-d.l;return a=i<p?(a*i+t)/(i+1):(a*(p-1)+t)/p})};
function agg(){H=[];HI=new Array(D.length);const ix={};D.forEach((d,i)=>{const b=Math.floor(d.t/SECH)*SECH;let k=ix[b];if(k==null){k=ix[b]=H.length;H.push({t:b,o:d.o,h:d.h,l:d.l,c:d.c})}else{const g=H[k];g.h=Math.max(g.h,d.h);g.l=Math.min(g.l,d.l);g.c=d.c}HI[i]=d.t+60>=b+SECH?k:k-1});
const c=H.map(h=>h.c);HX={e50:EMA(c,CONFIG.EMA_FAST),e200:EMA(c,CONFIG.EMA_SLOW),a:ATR(H,14)};ZC={}}
function calc(){const c=D.map(d=>d.c),m={},M=(k,f)=>m[k]||(m[k]=f());agg();X={ema:p=>M('e'+p,()=>EMA(c,p)),atr:(p=14)=>M('a'+p,()=>ATR(D,p))}}
/* Zona Supply/Demand Order Block di M15: candle lawan terakhir sebelum impuls yang menembus struktur (BOS) */
function zonesOf(S,a,n){const out=[];if(n<40)return out;
for(let k=Math.max(30,n-600);k<=n;k++){const d=S[k],body=Math.abs(d.c-d.o),rg=d.h-d.l;if(body<1.2*a[k-1]||body<.6*rg)continue;const up=d.c>d.o,w=S.slice(Math.max(0,k-8),k);
if(up?d.c<=Math.max(...w.map(q=>q.h)):d.c>=Math.min(...w.map(q=>q.l)))continue;
let b=k-1;while(b>k-4&&b>0&&((S[b].c>S[b].o)==up))b--;const B=S[b];if((B.c>B.o)==up)continue;
const z=up?{type:'D',top:Math.max(B.o,B.c),bot:B.l}:{type:'S',top:B.h,bot:Math.min(B.o,B.c)};z.t=B.t;z.ct=d.t+SECH;z.k=z.type+B.t;
let dead=0;for(let m=k+1;m<=n;m++){if(up?S[m].c<z.bot:S[m].c>z.top){dead=1;break}}if(!dead)out.push(z)}
return['D','S'].flatMap(t=>out.filter(z=>z.type==t).sort((p,q)=>q.t-p.t).slice(0,3))}
const zonesH=hi=>ZC[hi]||(ZC[hi]=zonesOf(H,HX.a,hi));
function run(i,AA){try{ex=null;return strategy(i,X,AA||A)}catch(e){ex=e.message;return {sig:'WAIT',why:'Error strategi: '+e.message,stage:0,dir:0}}}
let quiet=0;
function toast(t,b){const e=$('#toast');e.innerHTML='<b>'+t+'</b><br>'+b;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',8000)}
async function notify(t,b){try{toast(t,b)}catch(e){}if(!('Notification' in window)||Notification.permission!='granted')return;try{const r=await navigator.serviceWorker.getRegistration(),o={body:b,icon:'icon-192.png',badge:'icon-192.png',tag:'gold-'+Date.now(),vibrate:[300,120,300,120,300],requireInteraction:true};if(r)r.showNotification(t,o);else new Notification(t,o)}catch(e){}}
const sk=()=>'gold_snd_v1';
function save(){try{localStorage.setItem(sk(),JSON.stringify({botOn,bal:A.bal,b0:A.b0,last:A.last,lastT:A.lastT,pos:A.pos,pend:A.pend,uses:A.uses,trades:A.trades.slice(-200)}))}catch(e){}}
function catchUp(){quiet=1;const n0=A.trades.length;let sigs=0;const from=A.lastT||D[D.length-2].t;for(let i=0;i<D.length-1;i++){if(D[i].t<=from)continue;step(A,D[i].h,D[i].l,i);const b=A.last;onBar(A,i);if(A.last!=b&&A.last!='WAIT')sigs++;A.lastT=D[i].t}quiet=0;const dn=A.trades.length-n0;if(sigs||dn)notify('Gold Robot aktif lagi',`Selama aplikasi tertutup: ${sigs} setup, ${dn} trade selesai`)}
function restore(){let S=null;try{S=JSON.parse(localStorage.getItem(sk())||'null')}catch(e){}if(!S)return;A=Object.assign(mkA(1),{bal:S.bal,b0:S.b0,last:S.last,lastT:S.lastT,pos:S.pos,pend:S.pend||[],uses:S.uses||{},trades:S.trades||[]});const ix=t=>D.findIndex(d=>d.t==t);if(A.pos)A.pos.i=ix(A.pos.t);A.trades.forEach(t=>{t.i=ix(t.t);t.j=ix(t.tj)});if(S.botOn){botOn=1;catchUp()}}
const nt=(A,t,b)=>{if(A.live&&!quiet)notify(t,b)};
/* Rule: posisi terbuka -> tidak ada order/posisi baru. Pending hanya terisi jika belum ada posisi. */
function step(A,h,l,j){manage(A,h,l,j);if(!A.pos&&fillPend(A,h,l,j))manage(A,h,l,j)}
function fillPend(A,h,l,j){if(A.pos)return 0;for(const o of A.pend){if(D[j].t<=o.t)continue;if(!(o.dir>0?l<=o.entry:h>=o.entry))continue;
const lot=Math.max(.01,Math.floor(A.bal*CONFIG.RISK_PCT/100/(Math.abs(o.entry-o.sl)*100)*100)/100);A.pos={dir:o.dir,entry:o.entry,sl:o.sl,tp:o.tp,lot,i:j,t:D[j].t,via:o.type,zk:o.zk};A.uses[o.zk]=(A.uses[o.zk]||0)+1;A.pend=[];
nt(A,o.type+' terisi - XAU/USD',`Entry ${f2(o.entry)} | TP ${f2(o.tp)} | SL ${f2(o.sl)} | ${lot} lot`);return 1}return 0}
function closeP(A,px,why,j){const p=A.pos,pnl=(px-p.entry)*p.dir*100*p.lot-CONFIG.SPREAD*100*p.lot;A.bal+=pnl;A.trades.push({...p,exit:px,pnl,why,j,tj:D[j].t});A.pos=null;if(A.live&&!quiet)notify((why=='TP'?'Take Profit tersentuh':why=='SL'?'Stop Loss tersentuh':'Posisi ditutup ('+why+')')+' - XAU/USD',`${p.dir>0?'BUY':'SELL'} ${f2(p.entry)} -> ${f2(px)} | ${pnl>=0?'+':'-'}$${f2(Math.abs(pnl))} | Balance $${f2(A.bal)}`)}
function manage(A,h,l,j){const p=A.pos;if(!p)return;if(p.dir>0){if(l<=p.sl)closeP(A,p.sl,'SL',j);else if(h>=p.tp)closeP(A,p.tp,'TP',j)}else{if(h>=p.sl)closeP(A,p.sl,'SL',j);else if(l<=p.tp)closeP(A,p.tp,'TP',j)}}
function onBar(A,i){const g=run(i,A),now=D[i].t;
if(A.pos)A.pend=[];
else{A.pend=A.pend.filter(o=>{if(now>=o.exp){nt(A,'Pending dibatalkan - '+o.type,f2(o.entry)+': kedaluwarsa');return false}if(g.dir&&o.dir!=g.dir){nt(A,'Pending dibatalkan - '+o.type,f2(o.entry)+': tren M15 berubah');return false}return true});
if(g.order&&A.pend.length<CONFIG.MAX_PENDING&&!A.pend.some(o=>o.key==g.order.key)){const c=g.order;A.pend.push(c);nt(A,'Pending order dibuat - '+c.type,`Entry ${f2(c.entry)} | TP ${f2(c.tp)} | SL ${f2(c.sl)} | ${c.src}`)}}
A.last=g.sig;return g}
function stats(A){const t=A.trades,w=t.filter(x=>x.pnl>0),gw=w.reduce((a,x)=>a+x.pnl,0),gl=-t.filter(x=>x.pnl<=0).reduce((a,x)=>a+x.pnl,0);let e=A.b0,pk=e,dd=0;t.forEach(x=>{e+=x.pnl;pk=Math.max(pk,e);dd=Math.max(dd,(pk-e)/pk*100)});return{n:t.length,wr:t.length?w.length/t.length*100:0,pf:gl?gw/gl:gw?99:0,dd,net:A.bal-A.b0}}
const eq=A=>A.bal+(A.pos?(D[D.length-1].c-A.pos.entry)*A.pos.dir*100*A.pos.lot:0);
function backtest(){const B=mkA();for(let i=60;i<D.length;i++){step(B,D[i].h,D[i].l,i);onBar(B,i)}if(B.pos)closeP(B,D[D.length-1].c,'End',D.length-1);const s=stats(B);
$('#btr').innerHTML=`<div class="kv"><div><small>Trade</small><b>${s.n}</b></div><div><small>Win rate</small><b>${s.wr.toFixed(0)}%</b></div><div><small>Profit factor</small><b>${s.pf.toFixed(2)}</b></div><div><small>Net P/L</small><b class="${s.net>=0?'up':'dn'}">${s.net>=0?'+':''}$${f2(s.net)}</b></div><div><small>Max drawdown</small><b>${s.dd.toFixed(1)}%</b></div><div><small>Candle M1 diuji</small><b>${D.length}</b></div></div>`}
function showSig(){sg=run(D.length-2);const col=sg.sig=='BUY'?'var(--up)':sg.sig=='SELL'?'var(--dn)':'var(--ac)';$('#sg').textContent=sg.sig;$('#sg').style.color=col;$('#cf').style.cssText=`width:${(sg.stage||0)/3*100}%;background:${col}`;$('#cft').textContent=`Tahap ${sg.stage||0}/3 · 1 Zona M15 → 2 Harga di zona → 3 CHoCH M1`;$('#why').innerHTML=(sg.tr?`<li>${sg.tr}</li>`:'')+`<li>${sg.why}</li>`+(ex?`<li class="dn">${ex}</li>`:'')}

const goldOpen=()=>{const d=new Date(),w=d.getUTCDay(),h=d.getUTCHours();return !(w==6||(w==5&&h>=22)||(w==0&&h<22))};
