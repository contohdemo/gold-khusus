<script>
/* ============ 1. PENGATURAN (edit angka di sini) ============ */
const CONFIG={
  API_KEYS:[],        // JANGAN isi key di sini jika repo publik. Isi lewat aplikasi (tersimpan di HP).
  SYMBOL:'XAU/USD',
  BALANCE:10000,      // modal awal akun virtual ($)
  RISK_PCT:1,         // risiko per trade (% balance)
  RR:3,               // take profit = RR x jarak entry ke SL (video: RR 1:3)
  EMA_FAST:50,        // EMA tren (kuning)
  EMA_SLOW:200,       // EMA tren (putih)
  IMPULSE_ATR:1.2,    // candle impuls pembentuk OB minimal x ATR
  SL_BUFFER:0.5,      // SL "beberapa pips" di atas swing high / bawah swing low (USD)
  MIN_RISK:0.8,       // jarak minimal entry ke SL (USD)
  MAX_ENTRY:2,        // 1 zona HTF maksimal 2x entri
  PEND_BARS:24,       // order limit kedaluwarsa setelah N candle LTF
  ZONE_LOOK:150,      // jumlah candle HTF yang dicari zonanya
  MAX_CREDITS:780,    // batas request/hari (gratis = 800)
  /* --- Metode 2: SNR Key Level + Engulfing (video Forex Sarjana) --- */
  RR_B:2,             // RR trigger Engulfing (video: RR 1:2)
  ATR_SL:1,           // SL = swing +/- ATR x ini (+ spread untuk SELL)
  SPREAD:0.3,         // spread broker (USD)
  MOMENTUM_ATR:0.5,   // candle konfirmasi minimal x ATR
  SPIKE_ATR:2.5,      // candle > x ATR dianggap spike -> ABAIKAN
  TP_MODE:'conservative', // 'conservative' = TP tidak melewati swing HTF; 'aggressive' = tanpa batas
  RR_MIN_B:1.2,       // RR minimum setelah TP dibatasi swing HTF
  MAX_RISK:15,        // jarak SL maksimal (USD)
  /* --- Manajemen hybrid --- */
  SINGLE_RISK:0.6,    // area tunggal (OB saja / SNR saja) = 60% dari RISK_PCT; A+ (OB+SNR) = 100%
  LOSS_PAUSE:2,       // jeda setelah N x SL beruntun
  /* --- Pending antisipasi (dipasang saat menunggu momen konfirmasi terakhir) --- */
  PRE_ORDER:true,     // true = pasang order STOP lebih dulu; false = hanya entry setelah konfirmasi penuh
  PRE_RISK:0.7,       // lot order antisipasi = 70% dari lot normal (belum konfirmasi penuh)
  PRE_BUFFER:0.2,     // jarak order STOP dari level konfirmasi (USD)
  PRE_BARS_B:2        // order antisipasi Engulfing berlaku N candle
};
/* Pasangan Timeframe (video): Trend & Zona SnD -> Perkecil & Konfirmasi */
const PAIRS={'D1-H1':['1day','1h','D1 -> H1'],'H4-M15':['4h','15min','H4 -> M15'],'H1-M5':['1h','5min','H1 -> M5'],'M15-M1':['15min','1min','M15 -> M1']};
/* ============ 2. METODE HYBRID (2 video digabung) ============
 AREA (HTF)  : OB = Order Block+BOS+Imbalance (video 1) | SNR = Key Level support/resistance, flip otomatis (video 2).
               OB yang bertumpuk dengan SNR = grade A+ (risiko penuh). OB saja / SNR saja = risiko 60%.
 ARAH        : EMA50 vs EMA200 di HTF. Naik = hanya BUY di Demand/Support. Turun = hanya SELL di Supply/Resistance.
 TRIGGER A   : (area OB / A+) harga masuk area -> Choch di LTF -> LIMIT di OB LTF, SL swing +buffer, TP RR 1:3.
 TRIGGER B   : (area SNR / A+) Engulfing + candle momentum di LTF -> entry market, SL swing +/- ATR (+spread),
               TP RR 1:2 dibatasi swing HTF (mode conservative). Candle spike (>2.5x ATR) DIABAIKAN.
 MANAJEMEN   : hanya 1 posisi; jika ada posisi terbuka tidak ada order baru. Satu area maks 2x entri.
               Setelah 2x SL beruntun robot jeda sampai candle HTF berikutnya. Trigger yang muncul lebih dulu dipakai. */
const $=q=>document.querySelector(q),f2=v=>v.toFixed(2),SEC={'1min':60,'5min':300,'15min':900,'1h':3600,'4h':14400,'1day':86400},NM={'1min':'M1','5min':'M5','15min':'M15','1h':'H1','4h':'H4','1day':'D1'};
let pair='H1-M5';try{pair=localStorage.getItem('pair')||pair}catch(e){}if(!PAIRS[pair])pair='H1-M5';
let htf=PAIRS[pair][0],ltf=PAIRS[pair][1],D=[],H=[],X,XH,A,botOn=0,live=0,dirty=1,sg=null,pv,lastPoll=0,lastPollH=0,used=0,mouse=null,lastN=-1,quiet=0,KEY='',zc=new Map();
const dk='td_used_'+new Date().toISOString().slice(0,10);try{used=+localStorage.getItem(dk)||0}catch(e){}
const addUsed=()=>{used++;try{localStorage.setItem(dk,used)}catch(e){}};
const mkA=l=>({live:l,bal:CONFIG.BALANCE,b0:CONFIG.BALANCE,pos:null,pend:[],trades:[],zst:{},used:[]});A=mkA(1);
const EMA=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map((v,i)=>e=i?v*k+e*(1-k):v)};
function mkX(B){const m={},c=B.map(d=>d.c),M=(k,f)=>m[k]||(m[k]=f());return{ema:p=>M('e'+p,()=>EMA(c,p)),atr:(p=14)=>M('a'+p,()=>{let a=0;return B.map((d,i)=>{const t=i?Math.max(d.h-d.l,Math.abs(d.h-B[i-1].c),Math.abs(d.l-B[i-1].c)):d.h-d.l;return a=i<p?(a*i+t)/(i+1):(a*(p-1)+t)/p})})}}
function calc(){X=mkX(D);XH=mkX(H);zc=new Map();dirty=1}
const lastH=()=>{const n=H.length-1;return n<0?-1:(H[n].t+SEC[htf]<=Date.now()/1e3?n:n-1)};
const hIdxAt=tc=>{let a=-1,b=H.length-1;while(a<b){const m=(a+b+1)>>1;if(H[m].t+SEC[htf]<=tc)a=m;else b=m-1}return a};
const tIdx=t=>{let a=0,b=D.length-1;if(!D.length||t<=D[0].t)return 0;if(t>D[b].t)return b+1;while(a<b){const m=(a+b)>>1;if(D[m].t<t)a=m+1;else b=m}return a};
function trend(hi){if(hi<0)return 0;const a=XH.ema(CONFIG.EMA_FAST)[hi],b=XH.ema(CONFIG.EMA_SLOW)[hi];return a>b?1:a<b?-1:0}
/* ---- Zona SnD (Order Block + BOS + Imbalance) di HTF ---- */
function findZones(hi){const out=[];if(hi<40)return out;const a=XH.atr(14),pl=[],ph=[];
for(let i=2;i<=hi-2;i++){const b=H[i];if(b.l<H[i-1].l&&b.l<H[i-2].l&&b.l<H[i+1].l&&b.l<H[i+2].l)pl.push(i);if(b.h>H[i-1].h&&b.h>H[i-2].h&&b.h>H[i+1].h&&b.h>H[i+2].h)ph.push(i)}
for(let k=Math.max(30,hi-CONFIG.ZONE_LOOK);k<hi;k++){const d=H[k],dn=d.c<d.o,body=Math.abs(d.c-d.o);if(body<CONFIG.IMPULSE_ATR*a[k-1])continue;
const pv=(dn?pl:ph).filter(i=>i<=k-3).pop();if(pv==null)continue;if(dn?!(d.c<H[pv].l):!(d.c>H[pv].h))continue; // BOS
const imb=dn?(H[k+1].h<H[k-1].l?{top:H[k-1].l,bot:H[k+1].h,t:H[k-1].t}:null):(H[k+1].l>H[k-1].h?{top:H[k+1].l,bot:H[k-1].h,t:H[k-1].t}:null);if(!imb&&body<2*a[k-1])continue; // Imbalance
const req=j=>dn?H[j].c>H[j].o:H[j].c<H[j].o;let j=k-1;while(j>k-6&&j>0&&!req(j))j--;if(!req(j))continue; // OB
let key=dn?-1e9:1e9;for(let m=Math.max(0,j-20);m<=j;m++)key=dn?Math.max(key,H[m].h):Math.min(key,H[m].l);
let dead=0;for(let m=k+1;m<=hi;m++)if(dn?H[m].c>key:H[m].c<key){dead=1;break}if(dead)continue; // break key level
if(out.some(z=>z.t==H[j].t))continue;out.push({id:(dn?'S':'D')+H[j].t,type:dn?'S':'D',t:H[j].t,top:H[j].h,bot:H[j].l,imb,key,k})}
return out.sort((x,y)=>y.t-x.t)}
/* ---- SNR (Key Level) HTF: cluster swing -> area support/resistance, peran flip mengikuti posisi harga ---- */
function findSNR(hi){const out=[];if(hi<40)return out;const a=XH.atr(14)[hi],pv=[];
for(let i=Math.max(2,hi-CONFIG.ZONE_LOOK*2);i<=hi-2;i++){const b=H[i];if(b.h>H[i-1].h&&b.h>H[i-2].h&&b.h>H[i+1].h&&b.h>H[i+2].h)pv.push({p:b.h,t:b.t});if(b.l<H[i-1].l&&b.l<H[i-2].l&&b.l<H[i+1].l&&b.l<H[i+2].l)pv.push({p:b.l,t:b.t})}
const cl=[];pv.forEach(q=>{const c=cl.find(c=>Math.abs(c.p-q.p)<=a*.6);if(c){c.lo=Math.min(c.lo,q.p);c.hi=Math.max(c.hi,q.p);c.p=(c.p*c.n+q.p)/(c.n+1);c.n++;c.t=Math.min(c.t,q.t)}else cl.push({p:q.p,lo:q.p,hi:q.p,n:1,t:q.t})});
cl.filter(c=>c.n>=2).forEach(c=>{let top=c.hi+.15*a,bot=c.lo-.15*a;if(top-bot<.5*a){const m=(top+bot)/2;top=m+.25*a;bot=m-.25*a}out.push({id:'N'+Math.round(c.p),kind:'SNR',type:'N',t:c.t,top,bot,n:c.n})});
const px=H[hi].c;return out.sort((x,y)=>Math.abs(px-(x.top+x.bot)/2)-Math.abs(px-(y.top+y.bot)/2)).slice(0,6)}
const zonesFor=hi=>{if(!zc.has(hi)){const ob=findZones(hi).map(z=>({...z,kind:'OB',grade:'OB'})),keep=[];findSNR(hi).forEach(sn=>{const ov=ob.filter(z=>z.bot<=sn.top&&z.top>=sn.bot);if(ov.length)ov.forEach(z=>z.grade='A+');else keep.push({...sn,grade:'SNR'})});zc.set(hi,[...ob,...keep])}return zc.get(hi)};
const usable=(A,z)=>{const s=A.zst[z.id];return !s||(s.e<CONFIG.MAX_ENTRY&&s.s<2)};
const zs=(A,id)=>A.zst[id]||(A.zst[id]={e:0,s:0});
function broken(z,i,hi,dir){if(z.kind!='OB')return false;const tS=H[hi].t+SEC[htf];for(let m=i;m>=0&&D[m].t>=tS;m--)if(dir<0?D[m].c>z.key:D[m].c<z.key)return true;return false}
const gm=g=>g=='A+'?1:CONFIG.SINGLE_RISK;
const lotFor=(A,entry,sl,g,mul=1)=>Math.max(.01,Math.floor(A.bal*CONFIG.RISK_PCT*gm(g)*mul/100/(Math.abs(entry-sl)*100)*100)/100);
function htfSwing(hi,dir,entry){let best=null;for(let k=Math.max(2,hi-120);k<=hi-2;k++){const b=H[k];if(dir<0){if(b.l<H[k-1].l&&b.l<H[k-2].l&&b.l<H[k+1].l&&b.l<H[k+2].l&&b.l<entry&&(best==null||b.l>best))best=b.l}else if(b.h>H[k-1].h&&b.h>H[k-2].h&&b.h>H[k+1].h&&b.h>H[k+2].h&&b.h>entry&&(best==null||b.h<best))best=b.h}return best}
/* ---- Pending antisipasi: order STOP dipasang saat menunggu momen konfirmasi terakhir ---- */
function armPre(A,o){if(A.pos)return;const cur=A.pend[0];if(cur&&(!cur.pre||cur.sid===o.sid))return;if(A.used.includes(o.sid))return;
if(cur)nt(A,'Pending antisipasi diganti - '+cur.type,f2(cur.entry)+': setup berubah');A.pend=[o];A.used.push(o.sid);if(A.used.length>300)A.used.shift();
nt(A,'Pending antisipasi dibuat - '+o.type,`Entry ${f2(o.entry)} | TP ${f2(o.tp)} | SL ${f2(o.sl)} | ${o.src} | lot ${Math.round(CONFIG.PRE_RISK*100)}%`)}
function armB(A,i,hi,z,dir,R,make){const a=X.atr(14)[i];if(i<12||!(a>0))return 0;const c0=D[i-1],c1=D[i];
if(!(dir<0?c1.h>=z.bot&&c1.h<=z.top+1.5*a:c1.l<=z.top&&c1.l>=z.bot-1.5*a))return 0;
if(!(dir<0?(c1.c<c1.o&&c0.c>c0.o&&c1.o>=c0.c&&c1.c<=c0.o):(c1.c>c1.o&&c0.c<c0.o&&c1.o<=c0.c&&c1.c>=c0.o)))return 0;
if(c1.h-c1.l>CONFIG.SPIKE_ATR*a)return 0;
let sh=dir<0?-1e9:1e9;for(let k=i-6;k<=i;k++)sh=dir<0?Math.max(sh,D[k].h):Math.min(sh,D[k].l);
const entry=dir<0?c1.l-CONFIG.PRE_BUFFER:c1.h+CONFIG.PRE_BUFFER,slp=dir<0?sh+a*CONFIG.ATR_SL+CONFIG.SPREAD:sh-a*CONFIG.ATR_SL,risk=Math.abs(slp-entry);if(risk<CONFIG.MIN_RISK||risk>CONFIG.MAX_RISK)return 0;
let tp=entry+dir*risk*CONFIG.RR_B;if(CONFIG.TP_MODE=='conservative'){const sw=htfSwing(hi,dir,entry);if(sw!=null){const rr=Math.abs(sw-entry)/risk;if(rr<CONFIG.RR_MIN_B)return 0;if(dir<0?sw>tp:sw<tp)tp=sw}}
const sid=z.id+':PB:'+c1.t,zn=(z.kind=='OB'?(dir>0?'Demand OB ':'Supply OB '):'SNR ')+NM[htf]+' '+f2(z.bot)+'-'+f2(z.top);
R.stage='ARMED';R.armed=sid;R.why.push('[B] '+(dir<0?'Bearish':'Bullish')+' Engulfing terbentuk, menunggu candle momentum: pending antisipasi '+(dir<0?'SELL':'BUY')+' STOP '+f2(entry)+' (aktif otomatis jika momentum menembus)');
if(make)armPre(A,{type:dir<0?'SELL STOP':'BUY STOP',dir,entry,sl:slp,tp,src:zn+' - antisipasi momentum',zid:z.id,gr:z.grade,sid,pre:1,t:D[i].t,exp:D[i].t+CONFIG.PRE_BARS_B*SEC[ltf],info:{eg:{t:c1.t,dir},z:{kind:z.kind,type:z.type,top:z.top,bot:z.bot,t:z.t}}});
return 1}
/* ---- Trigger A: masuk area OB -> Choch -> OB LTF -> Limit ---- */
function engineA(A,i,hi,z,dir,R,make){const hn=NM[htf],zn=(dir>0?'Demand':'Supply')+' OB '+hn+' '+f2(z.bot)+'-'+f2(z.top)+(z.grade=='A+'?' [A+]':'');let hx=-1,hv=dir<0?-1e9:1e9;
for(let m=i;m>=Math.max(1,i-120);m--){if(D[m].t<z.t+SEC[htf])break;const inZ=dir<0?D[m].h>=z.bot:D[m].l<=z.top;if(inZ&&(dir<0?D[m].h>hv:D[m].l<hv)){hv=dir<0?D[m].h:D[m].l;hx=m}}
if(hx<0){if(R.stage=='-')R.stage='WAIT_ZONE';R.why.push('[A] Menunggu harga masuk '+zn);return 0}
if(dir<0?hv>z.key:hv<z.key)return 0;
let ms=null;for(let p=hx-3;p>=Math.max(2,hx-60);p--){const b=D[p];if(dir<0?(b.l<D[p-1].l&&b.l<D[p-2].l&&b.l<D[p+1].l&&b.l<D[p+2].l):(b.h>D[p-1].h&&b.h>D[p-2].h&&b.h>D[p+1].h&&b.h>D[p+2].h)){ms={p,v:dir<0?b.l:b.h};break}}
