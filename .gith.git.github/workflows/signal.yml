name: Sinyal XAUUSD

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Ketik 1 untuk tes notifikasi'
        required: false
        default: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run signal checker
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test || '0' }}
        run: node signal.js
