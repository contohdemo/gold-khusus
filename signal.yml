name: Sinyal XAUUSD
on:
  schedule:
    - cron: '3 * * * *'   # tiap jam, menit ke-3 (setelah candle H1 tutup)
  workflow_dispatch:
    inputs:
      test:
        description: 'Kirim notifikasi tes (1 = ya)'
        required: false
        default: '0'
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node signal.js
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
